<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>[[title]]</title><meta name="description" content="[[tagline]]"><style>*{box-sizing:border-box;margin:0}body{font-family:system-ui,sans-serif;color:#1f2340;line-height:1.7;background:#fff}nav{display:flex;justify-content:space-between;align-items:center;padding:1rem 6vw;border-bottom:1px solid #eee}nav b{font-size:1.3rem;color:#5b2bd6}nav a{color:#5b2bd6;text-decoration:none;font-weight:700}
.hero{padding:7vw 6vw;background:linear-gradient(135deg,#f3eeff,#fff);text-align:center}h1{font-size:clamp(2.2rem,6vw,4rem);line-height:1.1;animation:u .8s both}@keyframes u{from{opacity:0;transform:translateY(24px)}}.hero p{max-width:34em;margin:1rem auto 2rem;color:#555a7a;font-size:1.15rem}.btn{display:inline-block;padding:.9rem 2rem;background:#5b2bd6;color:#fff;border-radius:12px;text-decoration:none;font-weight:700;box-shadow:0 10px 30px #5b2bd644}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1.2rem;padding:4rem 6vw}.g div{padding:1.5rem;border:1px solid #e8e4f7;border-radius:16px;transition:.3s}.g div:hover{transform:translateY(-6px);box-shadow:0 18px 40px #5b2bd622}.g h3{color:#5b2bd6}.ab{padding:2rem 6vw 5rem;max-width:760px;margin:auto}footer{text-align:center;padding:2rem;background:#1f2340;color:#cbd}.cf{display:grid;gap:.7rem;max-width:520px;margin:1rem auto 0}.cf input,.cf textarea{padding:.8rem 1rem;border-radius:12px;border:1px solid #e8e4f7;font:inherit}.cf button{padding:.8rem;border:0;border-radius:12px;background:#5b2bd6;color:#fff;font-weight:700;cursor:pointer}.sent{color:#047857;font-weight:700}.ct{padding:0 6vw 4rem;text-align:center}</style></head>
<body><nav><b>[[title]]</b><a href="mailto:[[email]]">Contact</a></nav><section class="hero"><h1>[[title]]</h1><p>[[tagline]]</p><a class="btn" href="mailto:[[email]]">Get in touch</a></section>
<section class="g"><div><h3>Quality</h3><p>Careful work, every time.</p></div><div><h3>Reliable</h3><p>On time and on budget.</p></div><div><h3>Support</h3><p>Friendly help whenever you need it.</p></div></section><section class="ab"><h2>About us</h2><p>[[about]]</p></section><section class="ct"><h2>Contact us</h2><form class="cf" method="POST" action="[[form_action]]"><input type="text" name="_gotcha" style="display:none" tabindex="-1" autocomplete="off"><input name="name" placeholder="Your name" required maxlength="80"><input name="email" type="email" placeholder="Your email" required maxlength="120"><textarea name="message" placeholder="Your message" rows="4" required maxlength="1500"></textarea><button type="submit">Send message</button><p class="sent" id="sent" hidden>Thanks! Your message was sent.</p></form><script>if(/[?&]sent=1/.test(location.search)){var s=document.getElementById("sent");if(s){s.hidden=false;s.scrollIntoView()}}</script></section><footer>[[title]] &middot; [[email]]</footer></body></html>
